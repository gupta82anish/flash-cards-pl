<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E23B4E"/>
      <stop offset="1" stop-color="#C2172B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f3f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- back card (the "pair"), tilted -->
  <g transform="rotate(-9 512 512)" filter="url(#shadow)">
    <rect x="300" y="300" width="424" height="424" rx="56" fill="#ffd2d7"/>
  </g>

  <!-- front card -->
  <g transform="rotate(6 512 512)" filter="url(#shadow)">
    <rect x="276" y="288" width="472" height="448" rx="60" fill="url(#card)"/>
    <text x="512" y="512" font-family="Georgia, 'Times New Roman', serif" font-size="320"
          font-weight="700" fill="#C2172B" text-anchor="middle" dominant-baseline="central">PL</text>
  </g>
</svg>
